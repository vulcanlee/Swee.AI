<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="智閱引擎">
  <title>智閱引擎</title>
  <defs>
    <linearGradient id="dm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d1520" />
      <stop offset="0.55" stop-color="#240d14" />
      <stop offset="1" stop-color="#16080c" />
    </linearGradient>
    <radialGradient id="dm-glow" cx="0.2" cy="0.16" r="0.78">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.30" />
      <stop offset="1" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="dm-glow2" cx="0.88" cy="0.86" r="0.6">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.26" />
      <stop offset="1" stop-color="#e11d48" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="dm-page" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffeef2" />
      <stop offset="1" stop-color="#ffc9d6" />
    </linearGradient>
    <linearGradient id="dm-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="0.46" stop-color="#ffe4e9" stop-opacity="0.26" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="dm-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- 滿版底：刻意不自帶圓角，交由容器的 border-radius + overflow:hidden 裁切，
       splash（24px）與 login（30px）兩種圓角才都能貼齊、不露白邊。 -->
  <rect width="512" height="512" fill="url(#dm-bg)" />
  <rect width="512" height="512" fill="url(#dm-glow)" />
  <rect width="512" height="512" fill="url(#dm-glow2)" />

  <!-- 主體整體放大 1.1 倍，讓構圖貼近畫布四邊、不留視覺邊距 -->
  <g transform="translate(256,256) scale(1.1) translate(-256,-256)">

    <!-- 左：尚未結構化的文件頁（右上折角） -->
    <path d="M52 74a18 18 0 0 1 18-18h122l56 56v326a18 18 0 0 1-18 18H70a18 18 0 0 1-18-18z"
          fill="url(#dm-page)" />
    <path d="M192 56l56 56h-46a10 10 0 0 1-10-10z" fill="#e11d48" fill-opacity="0.30" />
    <g fill="#e11d48">
      <rect x="84" y="140" width="132" height="16" rx="8" fill-opacity="0.62" />
      <rect x="84" y="186" width="100" height="16" rx="8" fill-opacity="0.40" />
      <rect x="84" y="232" width="132" height="16" rx="8" fill-opacity="0.62" />
      <rect x="84" y="278" width="84" height="16" rx="8" fill-opacity="0.40" />
      <rect x="84" y="324" width="120" height="16" rx="8" fill-opacity="0.62" />
      <rect x="84" y="370" width="72" height="16" rx="8" fill-opacity="0.40" />
    </g>

    <!-- 中：解析光束，上下切齊畫布邊界 -->
    <polygon points="278,-40 338,-40 250,552 190,552" fill="url(#dm-beam)" />
    <polygon points="306,-40 318,-40 230,552 218,552" fill="url(#dm-core)" />

    <!-- 右：結構化知識節點；最外兩點刻意出界，表示知識仍在往外延伸 -->
    <g stroke="#fb7185" stroke-width="7" stroke-linecap="round" stroke-opacity="0.72" fill="none">
      <line x1="352" y1="256" x2="438" y2="150" />
      <line x1="352" y1="256" x2="446" y2="262" />
      <line x1="352" y1="256" x2="438" y2="368" />
      <line x1="446" y1="262" x2="486" y2="200" />
      <line x1="446" y1="262" x2="486" y2="324" />
    </g>
    <g>
      <circle cx="352" cy="256" r="26" fill="#ffeef2" />
      <circle cx="352" cy="256" r="11" fill="#e11d48" fill-opacity="0.5" />
      <rect x="412" y="124" width="52" height="52" rx="14" fill="#fb7185" />
      <circle cx="446" cy="262" r="21" fill="#fda4af" />
      <rect x="412" y="342" width="52" height="52" rx="14" fill="#fb7185" />
      <circle cx="486" cy="200" r="17" fill="#fda4af" fill-opacity="0.9" />
      <circle cx="486" cy="324" r="17" fill="#fda4af" fill-opacity="0.9" />
    </g>
  </g>
</svg>
